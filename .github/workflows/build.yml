name: Build & publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: pick up new Conductor releases automatically.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Conductor version to build (e.g. 3.32.5). Empty = latest stable release."
        required: false
        default: ""
      force:
        description: "Rebuild even if this version is already published"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: conductor-oss/conductor
  IMAGE_NAME: conductor
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      is_latest: ${{ steps.v.outputs.is_latest }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/conductor
        run: |
          set -euo pipefail
          # The Conductor project does not flag every release candidate as a prerelease, so pick the
          # highest plain vX.Y.Z release tag instead of trusting "latest release".
          latest=$(gh api --paginate "repos/$UPSTREAM_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          version=${INPUT_VERSION:-$latest}
          version=${version#v}
          {
            echo "version=$version"
            echo "minor=$(echo "$version" | cut -d. -f1-2)"
            echo "is_latest=$([ "$version" = "$latest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          build=true
          # Scheduled runs only build when the version is not published yet.
          if [ "$EVENT" = "schedule" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" != "true" ]; }; then
            if docker buildx imagetools inspect "${GHCR_IMAGE,,}:$version" >/dev/null 2>&1; then
              echo "$version already published, skipping."
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Latest stable Conductor release: $latest | building: $version | build: $build"

  # Smoke test every architecture natively before anything is published.
  smoke:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out Conductor v${{ env.VERSION }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: v${{ env.VERSION }}
          path: upstream

      - uses: docker/setup-buildx-action@v3

      - name: Build test image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: conductor:smoke
          build-args: CONDUCTOR_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.arch }}

      - name: Smoke test against PostgreSQL (${{ matrix.arch }})
        run: |
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          ./scripts/smoke-test.sh conductor:smoke

  publish:
    needs: [resolve, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      QUAY_ENABLED: ${{ secrets.QUAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out Conductor v${{ env.VERSION }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: v${{ env.VERSION }}
          path: upstream

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ---------- Publish ----------
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Quay.io
        if: env.PUBLISH == 'true' && env.QUAY_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Image names
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}
          QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE || github.repository_owner }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${OWNER,,}/$IMAGE_NAME"
            [ "$DOCKERHUB_ENABLED" = "true" ] && echo "docker.io/${DOCKERHUB_NAMESPACE,,}/$IMAGE_NAME"
            [ "$QUAY_ENABLED" = "true" ] && echo "quay.io/${QUAY_NAMESPACE,,}/$IMAGE_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ needs.resolve.outputs.minor }},enable=${{ needs.resolve.outputs.is_latest }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.is_latest }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CONDUCTOR_VERSION=${{ env.VERSION }}
          sbom: true
          provenance: mode=max
          # The jar and UI are built on amd64 here, as in the amd64 smoke job.
          cache-from: |
            type=gha,scope=smoke-amd64
            type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign images (keyless)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGES: ${{ steps.images.outputs.list }}
        run: |
          for img in $IMAGES; do
            cosign sign --yes "${img}@${DIGEST}"
          done

      - name: Sync Docker Hub description
        if: env.PUBLISH == 'true' && env.DOCKERHUB_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || github.repository_owner }}/${{ env.IMAGE_NAME }}
          short-description: "Conductor OSS workflow engine with UI. Non-root, multi-arch, signed, SBOM."
          readme-filepath: ./README.md
